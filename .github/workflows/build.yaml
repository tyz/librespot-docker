name: Build Librespot Docker (ARM64)

on:
  push:
    branches: ["master"]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # This uses the new beta ARM64 runners
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout upstream librespot
        uses: actions/checkout@v4
        with:
          repository: librespot-org/librespot
          path: librespot-source

      - name: Prepare build context
        run: |
          cp Dockerfile librespot-source/
          cp -r docker librespot-source/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./librespot-source
          file: ./librespot-source/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No 'platforms' arg needed, it defaults to the runner's arch (linux/arm64)
          cache-from: type=gha
          cache-to: type=gha,mode=max
